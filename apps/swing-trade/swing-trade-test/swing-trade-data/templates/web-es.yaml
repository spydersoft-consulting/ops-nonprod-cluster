---
# Source: swing-trade-data/templates/web-es.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-es
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: web-secrets
    template:
      type: kubernetes.io/secret
      engineVersion: v2
      data:
        OidcProxySettings__Oidc__Authority: "{{ .authority }}"
        OidcProxySettings__Oidc__ClientId: "{{ .client_id }}"
        OidcProxySettings__Oidc__ClientSecret: "{{ .client_secret }}"
        Redis__ConnectionString: "{{ .redis_host }}:6379,password={{ .redis_password }},abortConnect=false"

  data:
  # The Duende client for the BFF (docs/IDENTITY_SETUP.md step 3). TODO(owner): create the client in the identity admin UI and store its id and secret here.
  - secretKey: authority
    remoteRef:
      key: secrets-k8/swing-trade/test/auth
      property: authority
  - secretKey: client_id
    remoteRef:
      key: secrets-k8/swing-trade/test/auth
      property: client_id
  - secretKey: client_secret
    remoteRef:
      key: secrets-k8/swing-trade/test/auth
      property: client_secret
  # The shared Redis instance (same Vault entries PitStop uses; DECISIONS #117). Sessions are keyed by the cookie name swingtrade.session.
  - secretKey: redis_host
    remoteRef:
      key: secrets-k8/redis/nonproduction
      property: host
  - secretKey: redis_password
    remoteRef:
      key: secrets-k8/redis/nonproduction
      property: password
