  namespace: swing-trade-test
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/controller: api
      app.kubernetes.io/name: swing-trade-app
      app.kubernetes.io/instance: swing-trade-app
  template:
    metadata:
      annotations: 
        checksum/configMaps: a0bd7dc93346848fee6ae1d5c347797f1fe34b67fc3bf7a3b0f8ca89e9b9a629
      labels: 
        app.kubernetes.io/controller: api
        app.kubernetes.io/instance: swing-trade-app
        app.kubernetes.io/name: swing-trade-app
    spec: 
      enableServiceLinks: false
      serviceAccountName: default
      automountServiceAccountToken: true
