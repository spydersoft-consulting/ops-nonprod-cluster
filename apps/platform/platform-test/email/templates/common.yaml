apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: email-app
  labels:
    app.kubernetes.io/instance: email-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: email-app
    app.kubernetes.io/version: 0.0.1-beta.10
    helm.sh/chart: email-0.0.1-beta.10
  namespace: platform-test
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main
      namespace: envoy-gateway-system
  hostnames:
    - "email.mattgerega.net"
  rules:
    - backendRefs:
      - group: ""
        kind: Service
        name: email-app
        namespace: platform-test
        port: 80
        weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
