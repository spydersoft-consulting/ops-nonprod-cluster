# Source: email/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-app
  labels:
    app.kubernetes.io/controller: email-api
    app.kubernetes.io/instance: email-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: email-app
    app.kubernetes.io/version: 0.0.1-beta.10
    helm.sh/chart: email-0.0.1-beta.10
  namespace: platform-test
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: email-api
      app.kubernetes.io/name: email-app
      app.kubernetes.io/instance: email-app
  template:
    metadata:
      annotations: 
        checksum/configMaps: 409dd6ca43a143f682acbc030d0e178333e1b2e2fc95eb9701addcb89888782e
      labels: 
        app.kubernetes.io/controller: email-api
        app.kubernetes.io/instance: email-app
        app.kubernetes.io/name: email-app
    spec: 
      enableServiceLinks: false
      serviceAccountName: default
      automountServiceAccountToken: true
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      imagePullSecrets: 
        - name: cr-spydersoft-github
      containers: 
        - envFrom:
          - secretRef:
              name: email-secrets
          - configMapRef:
              name: email-app
          image: ghcr.io/spydersoft-consulting/email-api:0.0.1-beta.10
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 5m
